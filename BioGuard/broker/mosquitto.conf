# BioGuard — Mosquitto broker configuration (local development)
#
# Run with Docker from the BioGuard/ folder:
#   docker run -p 1883:1883 -v "$PWD/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf" eclipse-mosquitto

# Listen on all interfaces. Mosquitto 2.x with no listener configured only
# accepts connections from inside its own container/host.
listener 1883

# No authentication — development only. Add a password_file before
# exposing the broker beyond your machine.
allow_anonymous true

# Keep sessions and queued QoS 1 messages across broker restarts, so the
# backend's durable subscription still receives readings published while
# the broker (or the backend) was down.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
